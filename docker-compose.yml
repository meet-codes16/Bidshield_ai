services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iprocurement
      POSTGRES_USER: iprocurement
      POSTGRES_PASSWORD: iprocurement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://iprocurement:iprocurement@postgres:5432/iprocurement
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: iprocurement
      JWT_SECRET: change-this-before-production
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      MOCK_LLM: ${MOCK_LLM:-false}
      STORAGE_MODE: local
      AUTHORITY_MODE: mock
      EMBEDDING_MODE: local
      WORKER_MODE: inline
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend/data:/app/data

volumes:
  postgres_data:
  minio_data:
